TIMEOUT 30
DEFAULT JetsonIO

MENU TITLE L4T boot options

LABEL primary
      MENU LABEL primary kernel
      LINUX /boot/arducam/Image
      INITRD /boot/initrd
      APPEND ${cbootargs} root=PARTUUID=23328af8-8761-4eb6-b740-e39b933cdfd7 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=tty0 firmware_class.path=/etc/firmware fbcon=map:0 efi=runtime pci=pcie_bus_perf nvme.use_threaded_interrupts=1 nvidia-drm.modeset=1


# When testing a custom kernel, it is recommended that you create a backup of
# the original kernel and add a new entry to this file so that the device can
# fallback to the original kernel. To do this:
#
# 1, Make a backup of the original kernel
#      sudo cp /boot/Image /boot/Image.backup
#
# 2, Copy your custom kernel into /boot/Image
#
# 3, Uncomment below menu setting lines for the original kernel
#
# 4, Reboot

# LABEL backup
#    MENU LABEL backup kernel
#    LINUX /boot/Image.backup
#    INITRD /boot/initrd
#    APPEND ${cbootargs}
LABEL JetsonIO
	MENU LABEL Custom Header Config: <CSI Camera IMX519 Dual>
	LINUX /boot/arducam/Image
	FDT /boot/arducam/dts/dtb/tegra234-p3768-0000+p3767-0005-nv.dtb
	INITRD /boot/initrd
	APPEND ${cbootargs} root=PARTUUID=23328af8-8761-4eb6-b740-e39b933cdfd7 rw rootwait rootfstype=ext4 mminit_loglevel=4 console=ttyTCU0,115200 console=tty0 firmware_class.path=/etc/firmware fbcon=map:0 efi=runtime pci=pcie_bus_perf nvme.use_threaded_interrupts=1 nvidia-drm.modeset=1
#	OVERLAYS /boot/arducam/dts/tegra234-p3767-camera-p3768-imx519-dual.dtbo
# gemini version
#	OVERLAYS /boot/arducam/dts/tegra234-p3767-camera-p3768-imx519-single.dtbo
        #claude version
        OVERLAYS /boot/arducam/dts/tegra234-p3767-camera-p3768-imx519-cam0.dtbo
