# =============================================================================
# Chaplin LRS3 Config - Jetson Orin Nano + IMX519
# This file is read by pipelines/pipeline.py and main.py via hydra
# Comments use # or ; at start of line
# =============================================================================

[input]
# Modality: video only for silent wearable, audiovisual if you have mic
modality=video
# Video FPS expected by model - LRS3 trained at 25fps
v_fps=25

[model]
# FPS for model - must match training
v_fps=25
# Paths to pretrained AVSR model - fine-tuned personal model goes here to lower WER
model_path=benchmarks/LRS3/models/LRS3_V_WER19.1/model.pth
model_conf=benchmarks/LRS3/models/LRS3_V_WER19.1/model.json
# Language model for beam search rescoring (subword LM)
rnnlm=benchmarks/LRS3/language_models/lm_en_subword/model.pth
rnnlm_conf=benchmarks/LRS3/language_models/lm_en_subword/model.json

[decode]
# Beam search size: 1=fastest real-time (~1.5s), 3=balanced, 10=lowest WER but slower (~4s)
# For wearable real-time without LLM, use 1
beam_size=1
# Length bonus penalty
penalty=0.0
maxlenratio=0.0
minlenratio=0.0
# CTC weight for beam search: 0.3 balanced, 0.5 favors acoustic model (lower WER for clear lips)
ctc_weight=0.3
# LM weight for beam search: 0.3 balanced, 0.5 favors language model (helps grammar)
lm_weight=0.3

[capture]
# res_factor controls inference resolution:
#   res_factor=3 -> 640//3=212x160 (original, fastest, higher WER)
#   res_factor=2 -> 320x240 (recommended for 30-40cm wearable, 4x more lip pixels, ~30% slower)
#   res_factor=1 -> 640x480 (best WER, slowest, more memory)
# Moved from hardcoded chaplin.py to here so you can tune without code change
res_factor=2
# Capture FPS: 16 is original, 30 gives smoother but more frames to process
fps=16
# JPEG quality for saved clips before inference (25=high compression, 95=high quality)
frame_compression=25

[performance]
# MediaPipe face detection runs every Nth frame, interpolates rest
# 4=original, 8=you use now (2x faster), 12=even faster but may miss fast mouth moves
mediapipe_detect_every=8
# Camera open retries for Argus settling on Jetson (NvBufSurfaceFromFd Failed)
# 10=original, 30=more patient after reboot/Ollama
camera_open_retries=30
camera_open_retry_delay=3.0
# Allow fallback to V4L2 /dev/video0 if Argus fails - set 1 if you add second USB cam
camera_allow_v4l2_fallback=0

[tts]
# ALSA device - auto-detected if not set. For Jetson Orin Nano no jack, USB audio is card 2
# tts_espeak.py now auto-detects USB via /proc/asound/cards, so you can leave unset
# Explicit values: plughw:2,0 or plughw:CARD=USB04 or default
# If no speaker found, errors out as requested
alsa_device=default
# Piper TTS model - en_GB-semaine-medium is good balance
model_path=./voices/en_GB-semaine-medium.onnx
sample_rate=22050
# Real-time audio: speak RAW VSR immediately (1.5s) without waiting for LLM
# For wearable where everything is real-time, set raw=1 corrected=0
tts_raw=1
tts_corrected=0
# Disable Ollama entirely for max speed - no 20s LLM queue
disable_ollama=1

[ollama]
# Ollama LLM correction - optional, adds punctuation and fixes word errors
# qwen3:4b = 2.5GB, 20s correction (too slow for wearable)
# qwen3:1.7b = 1.4GB, 5-8s (recommended for 8GB Orin Nano)
# gemma3:1b = ~1GB, ~3s
# For real-time wearable, disable_ollama=1 above and skip this
model=qwen3:1.7b
host=
timeout_sec=20
num_predict=256
# Qwen3 has internal <think> trace that adds latency - /no_think suppresses it
disable_thinking=1

[vnc]
# VNC viewer for face positioning - TightVNC on Windows, vncviewer on Linux
# CHAPLIN_VNC=1 starts Xvfb :99 + x11vnc on port 5900
# Shows green "Fit face here" box + crosshair + Lighting OK/BAD feedback
# For positioning without headset
vnc=1

[stream]
# H264 UDP stream - no VNC needed, view with VLC rtp://@:5000
# Lower overhead than VNC, doesn't need cv2.namedWindow/GTK
# Preferred for final wearable
stream=0
host=192.168.1.41
port=5000
width=640
height=480
bitrate=1500000

[hardware]
# IMX519 on CAM0 via GStreamer - requires -v tegra:ro and /tmp/argus_socket mounts
# See run_chaplin_fixed.sh / chaplin_container_start.sh
use_hw_camera=1
egl_platform=device
egl_device_id=/dev/dri/renderD128
